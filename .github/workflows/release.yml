name: Build and release INQ Multik

on:
  workflow_dispatch:
    inputs:
      version:
        description: Test mod version
        required: true
        default: '0.1.0-test1'
        type: string
      game_version:
        description: World of Tanks version
        required: true
        default: '2.4.1.1'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHON2: C:/Python27/python.exe
      MOD_VERSION: ${{ inputs.version }}
      GAME_VERSION: ${{ inputs.game_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runtime contracts
        run: python -m unittest discover -s tests -v
      - name: Install Python 2.7
        shell: pwsh
        run: choco install python2 -y --no-progress
      - name: Compile and verify packages
        shell: pwsh
        run: python build.py --version "$env:MOD_VERSION" --game-version "$env:GAME_VERSION" --distribute
      - name: Check Python 2.7 method binding
        shell: pwsh
        run: '& $env:PYTHON2 tests/test_python27.py -v'
      - name: Upload checked packages
        uses: actions/upload-artifact@v4
        with:
          name: multik-release
          path: build/*
          if-no-files-found: error
          compression-level: 0
      - name: Publish test prerelease
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: v${{ inputs.version }}
          commit: ${{ github.sha }}
          name: INQ Multik v${{ inputs.version }}
          artifacts: build/*.wotmod,build/*.zip
          prerelease: true
          makeLatest: false
          generateReleaseNotes: true
          body: Test build. API contract tests and Python 2.7 compilation do not replace validation in World of Tanks.

